name: versioned build

on:
  push:
    # This is a glob, not a SemVer validator. Validate before checks or builds.
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    # Updating or deleting an existing tag must not produce another build.
    if: ${{ github.event.created == true && github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate stable version tag
        id: tag
        shell: bash
        env:
          # Pass the ref as data; never interpolate it into shell source.
          BRIDGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$BRIDGE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' 'Expected a stable vMAJOR.MINOR.PATCH tag without leading zeroes or suffixes.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$BRIDGE_TAG" >> "$GITHUB_OUTPUT"

  check:
    needs: validate
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: .go-version
          cache: true
      - run: make toolchain fmt vet test race generated openapi manifests security
      - run: echo 'NOT RUN — installed service/target hardware qualification'

  package:
    needs: [validate, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Build Linux and macOS archives
        run: make package
      - name: Verify packaged archives
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Upload versioned build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spry-bridge-${{ needs.validate.outputs.version }}
          path: |
            dist/spry-bridge-linux-amd64.tar.gz
            dist/spry-bridge-darwin-arm64.tar.gz
            dist/spry-bridge-darwin-amd64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
