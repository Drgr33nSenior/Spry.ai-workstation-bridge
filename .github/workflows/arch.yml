name: Arch Linux checks

on:
  workflow_call:
    inputs:
      version:
        description: Validated stable tag; empty for source checks without packaging
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      # Official Arch base-devel, 2026-09-07; userspace only, not an Arch kernel.
      image: quay.io/archlinux/archlinux@sha256:54c4df72eb71a3cad762b0189dd28ac21a4cea4af991b1cec5650d3f14b9dd01
      options: --cpus 2 --memory 6g --pids-limit 1024
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare isolated Arch userspace
        run: bash scripts/ci-arch-setup.sh
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run Arch source and race checks as an unprivileged user
        run: |
          chown -R bridge-ci:bridge-ci "$GITHUB_WORKSPACE"
          runuser -u bridge-ci -- env PATH="$PATH" make toolchain fmt vet test race generated openapi manifests security
      - name: Build and inspect the Arch package for a new version tag only
        if: ${{ inputs.version != '' }}
        env:
          BRIDGE_VERSION: ${{ inputs.version }}
        run: runuser -u bridge-ci -- env PATH="$PATH" BRIDGE_VERSION="$BRIDGE_VERSION" bash scripts/ci-arch-package.sh
      - name: Upload versioned Arch package and verified source recipe
        if: ${{ inputs.version != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spry-bridge-arch-${{ inputs.version }}
          path: |
            dist/arch/PKGBUILD
            dist/arch/spry-bridge-*-src.tar.gz
            dist/arch/spry-ai-workstation-bridge-*.pkg.tar.zst
            dist/arch/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
      - run: echo 'NOT RUN — installed systemd, Arch kernel, K3s and target hardware qualification'
